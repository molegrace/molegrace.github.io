        <div class="relative z-10 px-4 text-center">

        </div>

      <section class="bg-main-0 px-4 py-20 sm:px-6 lg:px-8 lg:pb-28 lg:pt-40">

              <div id="project-extra" class="mt-9 space-y-3 text-xl leading-8 text-main-600"></div>

              <div class="mt-9">
                <h3 class="text-2xl font-normal text-main-900">Share us on :</h3>

                  <a class="transition hover:text-primary-700" href="#" aria-label="Share on Facebook"><i class="bi bi-facebook"></i></a>
                  <a class="transition hover:text-primary-700" href="#" aria-label="Share on Twitter"><i class="bi bi-twitter-x"></i></a>
                  <a class="transition hover:text-primary-700" href="#" aria-label="Share on LinkedIn"><i class="bi bi-linkedin"></i></a>
                  <a class="transition hover:text-primary-700" href="#" aria-label="Share on Pinterest"><i class="bi bi-pinterest"></i></a>
                  <a class="transition hover:text-primary-700" href="#" aria-label="Share on Google Plus"><i class="bi bi-google"></i></a>
                </div>
              </div>
            </div>
          </aside>
        </div>
      </section>
    </main>

    <site-footer></site-footer>

    <script type="module" src="/src/layout/topnav.js"></script>

      };

      const escapeHtml = (value) =>
        String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");

      const params = new URLSearchParams(window.location.search);
      const projectKey = params.get("project") || "rukwa-site-verification-2021";
      const project = PROJECTS[projectKey] || PROJECTS["rukwa-site-verification-2021"];

      document.title = project.pageTitle;
      document.querySelector('meta[property="og:title"]').setAttribute("content", project.pageTitle);
      document.getElementById("project-hero-title").textContent = project.heroTitle;
      document.getElementById("project-title").textContent = project.title;

      document.getElementById("project-description").innerHTML = project.description
        .map((paragraph) => `<p>${escapeHtml(paragraph)}</p>`)
        .join("");

      document.getElementById("project-meta").innerHTML = project.meta
        .map(([label, value]) => `
          <div>
            <dt class="text-2xl font-normal text-main-900">${escapeHtml(label)} :</dt>
            <dd class="mt-1 text-xl leading-8 text-main-600">${escapeHtml(value)}</dd>
          </div>
        `)
        .join("");

      document.getElementById("project-images").innerHTML = project.images
        .map((image) => `
          <figure class="overflow-hidden rounded-md bg-main-100">
            <img src="${escapeHtml(image.src)}" alt="${escapeHtml(image.alt)}" class="aspect-[1.7/1] w-full object-cover" loading="lazy" decoding="async" />
          </figure>
        `)
        .join("");

      document.getElementById("project-extra").innerHTML = (project.extra || [])
        .map((item) => `
          <section>
            <h3 class="text-2xl font-normal text-main-900">${escapeHtml(item.title)}</h3>
            <p class="mt-2">${escapeHtml(item.body)}</p>
          </section>
        `)
        .join("");
    </script>
  </body>
</html>
