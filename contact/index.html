<body class="bg-main-0 font-sans text-main-900">

  <!-- KEEP COMPONENT -->
  <top-nav></top-nav>

  <main>

    <!-- Banner (same style as About page) -->
    <section
      class="relative h-62.5 flex items-center justify-center overflow-hidden bg-[url('/assets/images/home/inner-banner.jpg')] bg-cover bg-center bg-fixed">

      <div class="relative z-10 text-center">
        <h1 class="text-4xl sm:text-5xl font-extrabold text-main-0 tracking-wide">
          CONTACT US
        </h1>
      </div>
    </section>

    <!-- Contact Section -->
    <section class="bg-main-0 py-16">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">

        <!-- Title -->
        <div class="max-w-2xl">
          <h2 class="text-3xl font-bold tracking-tight text-main-950 sm:text-4xl">
            GET IN TOUCH
          </h2>

          <div class="mt-4 h-1 w-16 bg-main-300 rounded-full"></div>

          <p class="mt-6 text-main-700">
            We will contact you as soon as we receive your enquiry or call directly through
            <a href="tel:+255683162556" class="text-primary-600 font-semibold">+255 683 162 556</a>
            or
            <a href="tel:+255754360843" class="text-primary-600 font-semibold">+255 754 360 843</a>.
          </p>

          <p class="mt-2 text-main-700">
            You may visit
            <a href="/faq/" class="text-primary-600 underline">Frequently Asked Question (FAQ)</a>.
          </p>
        </div>

        <!-- Content -->
        <div class="mt-12 grid gap-10 lg:grid-cols-2">

          <!-- Image -->
          <div class="flex items-start">
            <div class="w-full h-96 bg-[url('/assets/images/home/15.jpg')] bg-cover bg-center rounded-md"></div>
          </div>

          <!-- Form -->
          <div class="bg-main-0 border border-main-200 rounded-md p-8 shadow-sm">

            <form action="" id="demo-form" method="post" class="space-y-5">

              <input type="text" name="first_name" placeholder="Full Names"
                class="w-full px-4 py-3 border border-main-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-400" />

              <input type="text" name="last_name" placeholder="Phone number"
                class="w-full px-4 py-3 border border-main-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-400" />

              <input type="text" name="email" placeholder="Email"
                class="w-full px-4 py-3 border border-main-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-400" />

              <textarea name="message" rows="6"
                placeholder="Type your message here include your location"
                class="w-full px-4 py-3 border border-main-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-400"></textarea>

              <!-- Recaptcha -->
              <div class="g-recaptcha" data-sitekey="6LfpUboqAAAAAPHXY1hzMBXpr98pdgI9sj-unr7e"></div>

              <!-- Button -->
              <button type="submit"
                class="inline-flex h-12 w-full items-center justify-center rounded-md bg-primary-600 px-6 text-sm font-bold text-main-0 shadow-sm transition hover:bg-primary-800 focus:outline-none focus:ring-2 focus:ring-primary-400">
                SEND MESSAGE
              </button>

              <!-- Alerts -->
              <div>
                <span class="text-green-600 hidden" id="alert-success">Message Successfully Sent.</span>
                <span class="text-red-600 hidden" id="alert-error">Message Sending Failed.</span>
              </div>

            </form>
          </div>

        </div>
      </div>
    </section>

    <!-- Map -->
    <section class="bg-main-0">
      <div class="grayscale">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3961.889992159914!2d39.09530347609869!3d-6.783240266339469!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x185c450195803033%3A0x37eb3b9519024158!2sDatabenki!5e0!3m2!1ssw!2stz!4v1691565391284!5m2!1ssw!2stz"
          class="w-full h-[400px] border-0"
          loading="lazy">
        </iframe>
      </div>
    </section>
